# =============================================================================
# Alembic 多数据库版本管理配置
#
# 通过 -x db=xxx 参数指定目标数据库:
#   alembic -x db=biliopusdb  upgrade head
#   alembic -x db=biliopusdb  revision --autogenerate -m "add extra_info"
#   alembic -x db=bilidb      upgrade head
#   alembic -x db=bilidb      revision --autogenerate -m "xxx"
#   alembic -x db=bili_reserve upgrade head
#   alembic -x db=dyndetail   upgrade head
#   alembic -x db=proxy_db    upgrade head
#   alembic -x db=samsclub    upgrade head
#
# 可用的数据库:
#   biliopusdb   - 普通抽奖动态库 (TLotdyninfo / TLotExtraInfo 等)
#   bilidb       - 话题抽奖库 (TTopic / TTrafficCard 等)
#   bili_reserve - 预约抽奖库 (TUpReserveRelationInfo 等)
#   dyndetail    - 动态详情库 (Bilidyndetail / Lotdata 等)
#   proxy_db     - 代理数据库 (ProxyTab / AvailableProxy)
#   samsclub     - 山姆会员店数据库 (SpuInfo 等)
#
# 查看状态:
#   alembic -x db=biliopusdb current
#   alembic -x db=biliopusdb history
#
# 自动生成迁移 (autogenerate):
#   alembic -x db=biliopusdb revision --autogenerate -m "描述"
#
# =============================================================================

[alembic]
# 脚本目录 (相对于此 ini 文件)
script_location = %(here)s/alembic

# version_locations 由 env.py 根据 -x db=xxx 参数动态设置，无需在此配置
# 各数据库的迁移文件分别存放在 versions/biliopusdb/ versions/bilidb/ 等子目录

# 迁移文件模板: 使用日期子目录组织
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# sys.path 前缀
prepend_sys_path = .

# 路径分隔符 (os 表示使用操作系统默认分隔符)
path_separator = os

# 每个数据库使用独立的 version_table，避免冲突
# 在 env.py 中动态设置为 alembic_version_<db_name>

# 日志级别（默认 WARNING，调试时可改为 INFO）
# sqlalchemy.url 由 env.py 从 CONFIG 模块动态读取，无需在此配置

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
