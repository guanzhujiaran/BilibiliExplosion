services:
    etcd:
        container_name: milvus-etcd
        image: quay.io/coreos/etcd:v3.5.25
        environment:
            - ETCD_AUTO_COMPACTION_MODE=revision
            - ETCD_AUTO_COMPACTION_RETENTION=1000
            - ETCD_QUOTA_BACKEND_BYTES=4294967296
            - ETCD_SNAPSHOT_COUNT=50000
        volumes:
            - ./docker_vol/milvus/etcd:/etcd
        command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
        healthcheck:
            test: ["CMD", "etcdctl", "endpoint", "health"]
            interval: 30s
            timeout: 20s
            retries: 3
        extra_hosts:
            - "host.docker.internal:host-gateway"
    minio:
        container_name: milvus-minio
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        environment:
            MINIO_ACCESS_KEY: minioadmin
            MINIO_SECRET_KEY: minioadmin
        ports:
            - "9001:9001"
            - "9000:9000"
        volumes:
            - ./docker_vol/milvus/minio:/minio_data
        command: minio server /minio_data --console-address ":9001"
        healthcheck:
            test:
                ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        extra_hosts:
            - "host.docker.internal:host-gateway"
    standalone:
        container_name: milvus-standalone
        image: milvusdb/milvus:v3.0-beta
        command: ["milvus", "run", "standalone"]
        security_opt:
            - seccomp:unconfined
        environment:
            ETCD_ENDPOINTS: etcd:2379
            MINIO_ADDRESS: minio:9000
            MQ_TYPE: woodpecker
        volumes:
            - ./docker_vol/milvus/data:/var/lib/milvus
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
            interval: 30s
            start_period: 90s
            timeout: 20s
            retries: 3
        ports:
            - "${MILVUS_PORT}:19530"
            - "9091:9091"
        depends_on:
            - "etcd"
            - "minio"
        extra_hosts:
            - "host.docker.internal:host-gateway"
    mysql:
        container_name: fastapi-mysql
        image: mysql:lts
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
            - TZ=${ENV_TZ}
        volumes:
            - ./docker_vol/mysql_data/conf.d:/etc/mysql/conf.d # 配置文件目录
            - ./docker_vol/mysql_data/data:/var/lib/mysql # 数据文件目录
        ports:
            - "${MYSQL_PORT}:3306" # 指定宿主机端口与容器端口映射关系，宿主机:容器
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
    redis:
        container_name: fastapi-redis
        image: redis:latest
        environment:
            - TZ=${ENV_TZ}
        volumes:
            - ./docker_vol/redis/data:/data
        ports:
            - "${REDIS_PORT}:6379"
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
    rabbitmq:
        container_name: fastapi-rabbitmq
        image: rabbitmq:management
        ports:
            - "${RABBITMQ_PORT}:5672"
            - "${RABBITMQ_WEBUI_PORT}:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
            - TZ=${ENV_TZ}
        volumes:
            - ./docker_vol/rabbitmq/data:/var/lib/rabbitmq
            - ./docker_vol/rabbitmq/logs:/var/log/rabbitmq
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
    postgres:
        container_name: postgres
        image: postgres:alpine3.22
        volumes:
            - ./docker_vol/postgres/data:/var/lib/postgresql
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - TZ=${ENV_TZ}
        ports:
            - "${POSTGRES_PORT}:5432"
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
    gateway:
        container_name: gateway
        depends_on:
            - postgres
            - redis
            - casdoor
        build:
            context: ./be-gateway
            target: prod
        volumes:
            - be-gateway_node_modules:/app/node_modules # 使用命名卷保存 node_modules
            - ./be-gateway:/app
        ports:
            - "${NODEJS_PPTR_PORT}:9923"
        restart: unless-stopped
        environment:
            - DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/PPTR_Bili_Lot
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_PWD=
            - BILI_CRAWLER_URI=${BILI_CRAWLER_URI}
            - RPA_SERVICE_URI=${RPA_SERVICE_URI}
            - MESSAGE_SERVICE_URI=${MESSAGE_SERVICE_URI}
            - CASDOOR_ENABLED=true
            - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
            - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
            - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
            - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION}
            - CASDOOR_APPLICATION=${CASDOOR_APPLICATION}
            - CASDOOR_REDIRECT_URI=${CASDOOR_REDIRECT_URI}
            - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE}
            - TZ=${ENV_TZ}
        extra_hosts:
            - "host.docker.internal:host-gateway"
    casdoor:
        container_name: fastapi-casdoor
        image: casbin/casdoor:latest
        restart: unless-stopped
        ports:
            - "${CASDOOR_PORT}:8000"
        volumes:
            - ./docker_vol/casdoor/conf/app.conf:/conf/app.conf
        environment:
            - TZ=${ENV_TZ}
        depends_on:
            - postgres
        extra_hosts:
            - "host.docker.internal:host-gateway"
    be-message-service:
        container_name: be-message-service
        build:
            context: .
            dockerfile: ./Dockerfile.mono
            target: message
        volumes:
            # 源码挂在容器项目根下（Dockerfile.mono message 阶段 WORKDIR=/app，app 包 → /app/app）
            - ./be-message-service/app:/app/app
            # Alembic 迁移（启动自动 upgrade head）：镜像只 COPY 了 app 包，
            # 根目录 ini 与脚本目录都不在镜像里，必须挂载，否则迁移静默失败
            - ./be-message-service/alembic.ini:/app/alembic.ini
            - ./be-message-service/alembic:/app/alembic
            # pptr Postgres 用户库（PPTR_Bili_Lot）是独立 Alembic 分支，单独挂载
            - ./be-message-service/alembic_pptr.ini:/app/alembic_pptr.ini
            - ./be-message-service/alembic_pptr:/app/alembic_pptr
            # 内容审核词库（data/sensitive-words：三层词库 / 分类词库 / whitelist / 域名名单）。
            # 不挂载时容器内无该目录，审核引擎会按弱依赖降级成空词库（全部放行）。
            - ./be-message-service/data:/app/data
            # GeoIP 属地库（GeoLite2 mmdb），与 GEOIP_MMDB_DIR 一致
            - ./docker_vol/geoip/mmdb:/app/mmdb
            - ./docker_vol/uv_cache:/root/.cache/uv # uv 运行时缓存（主机持久化，构建期走 BuildKit cache mount）
        ports:
            - "${MESSAGE_SERVICE_PORT}:18739"
        depends_on:
            - rabbitmq
            - mysql
            - casdoor
        environment:
            - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=180
            # 业务日志等级（loguru，只输出 stderr、不写文件；开发可设 DEBUG）
            - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
            # 消息系统主库（元数据库）：系统通知 / 事件提醒 / 私信索引与会话 / 消息设置
            # 私信「内容」不在此库，而是按月分库 bili_msg_content_YYYYMM + 库内 100 张分表
            - MYSQL_MESSAGE_URL=mysql+aiomysql://root:${MYSQL_PASSWORD}@mysql:3306/BiliMessageDB?charset=utf8mb4
            # 直连 pptr 的 Postgres（PPTR_Bili_Lot）只读取用户展示信息与 @ 搜索，不写入
            - POSTGRES_PPTR_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/PPTR_Bili_Lot
            # 与 be-bilibili-crawler / rpa-browser 共用同一份推送渠道配置（JSON）
            - MESSAGE_CONFIG=${MESSAGE_CONFIG}
            # Casdoor OAuth2 配置（与 gateway 共用同一套 Casdoor 应用）
            - CASDOOR_ENABLED=true
            - CASDOOR_ENDPOINT=http://fastapi-casdoor:8000
            - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
            - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
            - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION}
            - CASDOOR_APPLICATION=${CASDOOR_APPLICATION}
            - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE}
            # Casdoor 管理员账号（查询用户信息用，password grant 换 admin token）
            # 管理员走内置 application「app-built-in」，clientId/clientSecret 与普通登录应用不同
            - CASDOOR_ADMIN_NAME=${CASDOOR_ADMIN_NAME}
            - CASDOOR_ADMIN_PASSWORD=${CASDOOR_ADMIN_PASSWORD}
            - CASDOOR_ADMIN_CLIENT_ID=${CASDOOR_ADMIN_CLIENT_ID}
            - CASDOOR_ADMIN_CLIENT_SECRET=${CASDOOR_ADMIN_CLIENT_SECRET}
            # GeoIP 属地库目录（与挂载点一致）
            - GEOIP_MMDB_DIR=/app/mmdb
            - TZ=${ENV_TZ}
        restart: unless-stopped
        extra_hosts:
            - "host.docker.internal:host-gateway"
    llama_cpp:
        image: ghcr.nju.edu.cn/ggml-org/llama.cpp:server
        container_name: llama_cpp
        volumes:
            - ./docker_vol/llama/models.ini:/models.ini
            - ./docker_vol/llama_model/cache:/root/.cache
        ports:
            - ${LLAMA_PORT}:8080
        restart: unless-stopped
        environment:
            - LLAMA_ARG_MODELS_PRESET=/models.ini
            - LLAMA_ARG_MODELS_MAX=1
            - HF_ENDPOINT=https://hf-mirror.com
        extra_hosts:
            - "host.docker.internal:host-gateway"
volumes:
    be-gateway_node_modules:
networks:
    default:
        enable_ipv6: true
        name: fastapi
        driver: bridge
