services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./docker_vol/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./docker_vol/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0-beta
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./docker_vol/milvus/data:/var/lib/milvus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:?请在 .env 里设置 MILVUS_PORT（宿主机映射端口，容器内固定 19530）}:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mysql:
    container_name: fastapi-mysql
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD（MySQL root 密码，mysql 容器与各服务共用）}
      # 供 init 脚本创建查询服务的只读账号（密码不落仓库）
      - RO_USER=${CRAWLER_QUERY_MYSQL_USER:-bili_ro}
      - RO_PASSWORD=${CRAWLER_QUERY_MYSQL_PASSWORD:-}
      - TZ=${ENV_TZ:-Asia/Shanghai}
    volumes:
      - ./docker_vol/mysql_data/conf.d:/etc/mysql/conf.d # 配置文件目录
      - ./docker_vol/mysql_data/data:/var/lib/mysql # 数据文件目录
      # 只读账号：**仅当 data/ 为空（全新环境）时执行一次**；
      # 已有数据的库不会跑，用 scripts/database/create_read_only_account/ 补（幂等）
      - ./docker_vol/mysql_data/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:?请在 .env 里设置 MYSQL_PORT（宿主机映射端口，容器内固定 3306）}:3306" # 指定宿主机端口与容器端口映射关系，宿主机:容器
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    container_name: fastapi-redis
    image: redis:latest
    environment:
      - TZ=${ENV_TZ:-Asia/Shanghai}
    volumes:
      - ./docker_vol/redis/data:/data
    ports:
      - "${REDIS_PORT:?请在 .env 里设置 REDIS_PORT（宿主机映射端口，容器内固定 6379）}:6379"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rabbitmq:
    container_name: fastapi-rabbitmq
    image: rabbitmq:management
    ports:
      - "${RABBITMQ_PORT:?请在 .env 里设置 RABBITMQ_PORT（宿主机映射端口，容器内固定 5672）}:5672"
      - "${RABBITMQ_WEBUI_PORT:?请在 .env 里设置 RABBITMQ_WEBUI_PORT（宿主机映射端口，容器内固定 15672）}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER（RabbitMQ 账号）}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD（RabbitMQ 密码）}
      - TZ=${ENV_TZ:-Asia/Shanghai}
    volumes:
      - ./docker_vol/rabbitmq/data:/var/lib/rabbitmq
      - ./docker_vol/rabbitmq/logs:/var/log/rabbitmq
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  unidbg:
    container_name: fastapi-unidbg
    image: unidbg-springboot-samsclub
    environment:
      - TZ=${ENV_TZ:-Asia/Shanghai}
    ports:
      - "${UNIDBG_PORT:?请在 .env 里设置 UNIDBG_PORT（宿主机映射端口，容器内固定 23335）}:23335"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  be-bilibili-crawler:
    deploy:
      resources:
        limits:
          memory: 5G
    # 打开文件数上限：Docker 默认 soft=1024（与宿主 `ulimit -n` 无关），
    # 抓取链路（代理池健康检查 + 大量并发 httpx/grpc 连接 + 日志文件）
    # 在高并发时容易撞到 EMFILE（Too many open files）。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: be-bilibili-crawler
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - unidbg
    environment:
      - MYSQL_HOST=mysql
      # CONFIG.py 的 env_file 是 (.env.fastapi.prod, .env.fastapi.dev)，pydantic-settings
      # 后者覆盖前者；源码 bind mount 后宿主机上的 .env.fastapi.dev 也会进容器
      # （镜像里它被 .dockerignore 排除），于是 dev 的「宿主机视角」值会盖掉 prod 的
      # 「容器视角」值（dev: MYSQL_PORT=10000 / LLAMA_HOST=localhost / LLAMA_PORT=10009）。
      # 环境变量优先级最高，容器视角的键必须在这里显式给出。
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Redis 密码（生产 Redis 设了 requirepass 时必填；空 = 无密码）
      - REDIS_PWD=${CRAWLER_REDIS_PWD:-}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - UNIDBG_HOST=unidbg
      - UNIDBG_PORT=23335
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - MESSAGE_SERVICE_HOST=be-message-service
      - MESSAGE_SERVICE_PORT=18739
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD（MySQL root 密码，mysql 容器与各服务共用）}
      - RABBITMQ_USER=${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER（RabbitMQ 账号）}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD（RabbitMQ 密码）}
      - MESSAGE_CONFIG=${MESSAGE_CONFIG:?请在 .env 里设置 MESSAGE_CONFIG（推送渠道配置 JSON，留空会让各服务启动时 pydantic 校验失败）}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - PROXY_SERVER=${PROXY_SERVER}
      - V2RAY_HOST=${V2RAY_HOST}
      - V2RAY_PORT=10809
      # FastStream（RabbitMQ 框架）自身日志级别，与业务日志 LOG_LEVEL 相互独立
      - FASTSTREAM_LOG_LEVEL=${FASTSTREAM_LOG_LEVEL:-WARNING}
      - TZ=${ENV_TZ:-Asia/Shanghai}
      # 下面几个键都带 compose 默认值：这些值「漏配也能跑/本就不该随环境变」，
      # 只留 .env 可覆盖。省掉它们不会变成空字符串（空串会盖掉 .env.fastapi.* 里的值，
      # 也会让 pydantic 校验 int / JSON 字段直接报错）。
      - SHOW_LOG=${FASTAPI_SHOW_LOG:-0}
      # 业务日志等级（loguru，SHOW_LOG=0 时作用于 stdout sink）。
      # 与 be-message-service 共用同一变量名 LOG_LEVEL，宿主 .env 里设一次即可统一调整；
      # 未设置时默认 WARNING（只保留告警与错误）；临时排查可设 INFO。
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # 生产编排默认 0（启动定时任务）；开发编排 docker-compose.dev.yml 显式写 1
      - IS_DEV=${IS_DEV:-0}
      - llm_apis=${llm_apis:-[]}
      # 同上的原因：这三项在 .env.fastapi.dev 里是宿主机视角（localhost / 10009 / True），
      # 会覆盖 prod 文件里的容器视角值
      - LLAMA_HOST=llama_cpp
      - LLAMA_PORT=8080
      - sqlalchemy_logging=False
      # 爬虫开始 / 结束推送开关（默认全关）：逗号分隔 crawler_name，* 表示全部爬虫
      - CRAWLER_PUSH_START=${CRAWLER_PUSH_START:-}
      - CRAWLER_PUSH_END=${CRAWLER_PUSH_END:-}
      # 运行期可变状态（推送开关等本地 JSON），接口改完立即生效、重启后保留
      - RUNTIME_DIR=/app/runtime
      # dyn_backup 根目录（挂载点，见下方 volumes 的 dyn_backup 项）
      # 产物统一格式（一律按月分片）：{DYN_BACKUP_DIR}/{任务名}/{年}/{YYYY_MM}_{任务名}.csv.gz
      #   - bilidyndetail / t_lotdyninfo / t_lotuserspaceresp：冷数据表归档（校验后删库）
      #   - lot_dyn_info：抽奖信息业务导出（只导已过完的整月）
      - DYN_BACKUP_DIR=/app/scripts/database/dyn_backup
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: crawler
    # 源码整目录 bind mount 到 /app，与 be-message-service 对齐：
    # 改完代码 `docker compose restart be-bilibili-crawler` 即生效，无需重建镜像。
    # 前提：构建期已把 node_modules 外移到 /opt/node_modules（见 Dockerfile.mono），
    # 否则宿主机目录会顶掉容器内的 node_modules，execjs 的 require('jsdom'/'md5') 会失败；
    # 虚拟环境同样在 /app 之外（UV_PROJECT_ENVIRONMENT=/opt/venv），不受挂载影响。
    volumes:
      # 源码（容器内代码根目录 /app，入口 uvicorn main:app）
      - ./be-bilibili-crawler:/app
      # 公共包源码：PYTHONPATH 含 /bili-common，改 bili-common 同样重启即生效
      - ./bili-common:/bili-common
      # 运行期日志落宿主机（容器内外都要可见；子路径挂载优先于父路径 /app）
      - ./docker_vol/fastapi/log:/app/scripts/log
      # 每日 dyn_backup（CrawlerScheduler 0 点：抽奖信息导出 + 冷数据归档，全部 *.csv.gz）
      # 显式落 docker_vol，不跟源码混在一起；代码侧走 DYN_BACKUP_DIR 读取该路径
      # （见 be-bilibili-crawler/Service/DataArchive/）。
      # 按「任务名/年/日期」分文件，整个目录打包即可上传网盘。
      - ./docker_vol/fastapi/dyn_backup:/app/scripts/database/dyn_backup
      # 运行期可变状态文件（爬虫推送开关），不跟源码混在一起
      - ./docker_vol/fastapi/runtime:/app/runtime
    develop:
      watch:
        # 源码已 bind mount，不再需要 sync+restart；只有依赖变了才重建镜像
        # （uv sync --locked 在构建期跑，venv 随镜像更新）
        - action: rebuild
          path: ./be-bilibili-crawler/uv.lock
        - action: rebuild
          path: ./be-bilibili-crawler/pyproject.toml
    ports:
      - "${FASTAPI_PORT:?请在 .env 里设置 FASTAPI_PORT（宿主机映射端口，容器内固定 23333）}:23333"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # ===== 查询服务（crawler-query target）=====
  # 与 be-bilibili-crawler 同一份源码 / 同一个 Dockerfile.mono，换 target 与入口：
  #   只挂只读路由（Add* / 爬虫状态 / zhuanlan / MQ / background_service 一律不挂）
  #   lifespan 不跑 alembic 迁移、不做 schema 校验、不初始化 Milvus、不启动调度器
  # 因此这个容器可以单独指向生产只读副本 / 只读账号，而不会在生产库上执行 DDL。
  # 需要改查询库地址时，只覆盖本服务的 MYSQL_* 即可（爬虫容器不受影响）。
  be-bilibili-crawler-query:
    deploy:
      resources:
        limits:
          # 查询进程不跑 chromium，也不加载极验的 ONNX 模型
          # （ClickPy 已改为首次识别时才创建，见 Utils/GrpcUtils/极验/极验点击验证码.py），
          # 2G 足够；与爬虫容器（5G）拉开差距。
          memory: 2G
    container_name: be-bilibili-crawler-query
    depends_on:
      # 查询只依赖 MySQL 与 Redis：RabbitMQ / unidbg / milvus 起来与否不影响它启动
      - mysql
      - redis
    environment:
      - SERVICE_ROLE=query
      # ===== 本服务的连接参数独立于爬虫容器 =====
      # 想让「开发服务器的查询服务直连生产库」时，只改根 .env 里这 7 个 CRAWLER_QUERY_* 变量即可，
      # 爬虫容器仍连本地库，互不影响：
      #   CRAWLER_QUERY_MYSQL_HOST / PORT / USER / PASSWORD  -> 生产库 + 只读账号（bili_ro）
      #   CRAWLER_QUERY_REDIS_HOST / PORT / PWD             -> 生产 Redis（直播抽奖数据只存在于 Redis）
      # 注意：compose 不支持 ${A:-${B}} 嵌套默认值，所以密码不能回落到 MYSQL_PASSWORD，
      # 必须由 .env 显式给值；本地默认值与 MYSQL_PASSWORD 相同（见 .env.example 的说明）。
      - MYSQL_HOST=${CRAWLER_QUERY_MYSQL_HOST:-mysql}
      - MYSQL_PORT=${CRAWLER_QUERY_MYSQL_PORT:-3306}
      - MYSQL_USER=${CRAWLER_QUERY_MYSQL_USER:-root}
      - MYSQL_PASSWORD=${CRAWLER_QUERY_MYSQL_PASSWORD:-}
      # Redis 不是可选项：GetLiveLottery / GetLotteryFilterParams 的直播数据读的是 Redis
      # 的 all_live_lot，不在 MySQL 里；漏配会表现为「直播抽奖页永远空白」且不报错。
      - REDIS_HOST=${CRAWLER_QUERY_REDIS_HOST:-redis}
      - REDIS_PORT=${CRAWLER_QUERY_REDIS_PORT:-6379}
      - REDIS_PWD=${CRAWLER_QUERY_REDIS_PWD:-}
      # 以下键在 Settings 里是必填项（无默认值），查询链路不会真正连接，
      # 但必须给值否则 pydantic 校验会拒绝启动
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER（RabbitMQ 账号）}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD（RabbitMQ 密码）}
      - UNIDBG_HOST=unidbg
      - UNIDBG_PORT=23335
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
      - LLAMA_HOST=llama_cpp
      - LLAMA_PORT=8080
      - V2RAY_HOST=${V2RAY_HOST}
      - V2RAY_PORT=10809
      - FASTSTREAM_LOG_LEVEL=${FASTSTREAM_LOG_LEVEL:-WARNING}
      - MESSAGE_SERVICE_HOST=be-message-service
      - MESSAGE_SERVICE_PORT=18739
      - PROXY_SERVER=${PROXY_SERVER}
      - MESSAGE_CONFIG=${MESSAGE_CONFIG:?请在 .env 里设置 MESSAGE_CONFIG（推送渠道配置 JSON，留空会让各服务启动时 pydantic 校验失败）}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - TZ=${ENV_TZ:-Asia/Shanghai}
      - SHOW_LOG=${FASTAPI_SHOW_LOG:-0}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # 查询容器不跑调度器，IS_DEV 只影响启动分支，给默认值避免空串导致 int 校验失败
      - IS_DEV=${IS_DEV:-0}
      - llm_apis=${llm_apis:-[]}
      - sqlalchemy_logging=False
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: crawler-query
    volumes:
      - ./be-bilibili-crawler:/app
      - ./bili-common:/bili-common
      # 日志单独落一个目录：log/base_log.py 的文件名是固定的
      # error_<logger>_log.log，两个容器共用同一目录会同时 rotation 同一个文件
      - ./docker_vol/fastapi/log_query:/app/scripts/log
    develop:
      watch:
        - action: rebuild
          path: ./be-bilibili-crawler/uv.lock
        - action: rebuild
          path: ./be-bilibili-crawler/pyproject.toml
    ports:
      - "${FASTAPI_QUERY_PORT:-23336}:23336"
    # 与 crawler 容器同一口径：查询侧同样有大量并发连接（前端 + RPA RPC），
    # Docker 默认 nofile soft=1024 偏低。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    container_name: postgres
    image: postgres:alpine3.22
    volumes:
      - ./docker_vol/postgres/data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（Postgres 密码）}
      - POSTGRES_USER=${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER（Postgres 账号）}
      - TZ=${ENV_TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:?请在 .env 里设置 POSTGRES_PORT（宿主机映射端口，容器内固定 5432）}:5432"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  gateway:
    container_name: gateway
    depends_on:
      - postgres
      - redis
      - casdoor
    build:
      context: ./be-gateway
      target: prod
    volumes:
      - be-gateway_node_modules:/app/node_modules # 使用命名卷保存 node_modules
      - ./be-gateway:/app
    ports:
      - "${NODEJS_PPTR_PORT:?请在 .env 里设置 NODEJS_PPTR_PORT（宿主机映射端口，容器内固定 9923）}:9923"
    restart: unless-stopped
    environment:
      # ===== 容器间访问地址：全部带默认值 =====
      # 这些地址在容器网内是固定的（服务名 + 容器端口），只有「网关不在同一套编排里」
      # 才需要覆盖，所以默认值直接写在编排里，.env 里可以不写。
      - DB=postgres://${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER（Postgres 账号）}:${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（Postgres 密码）}@${POSTGRES_HOST:-postgres}:5432/PPTR_Bili_Lot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PWD=
      - BILI_CRAWLER_URI=${BILI_CRAWLER_URI:-http://be-bilibili-crawler:23333}
      # 只读查询服务（crawler-query target）。**故意不给默认值**：
      # 空值时网关按 `process.env.BILI_CRAWLER_QUERY_URI || process.env.BILI_CRAWLER_URI`
      # 回落到爬虫容器，只起一个 crawler 容器的部署方式行为不变；
      # 一旦在这里写死默认值，没起查询容器的部署会被指到一个不存在的地址。
      - BILI_CRAWLER_QUERY_URI=${BILI_CRAWLER_QUERY_URI:-}
      - RPA_SERVICE_URI=${RPA_SERVICE_URI:-http://rpa-browser:28000}
      - MESSAGE_SERVICE_URI=${MESSAGE_SERVICE_URI:-http://be-message-service:18739}
      - CASDOOR_ENABLED=true
      # 网关只用它做服务端反向代理（/api/v1/casdoor/backend），不需要浏览器可达的公网地址
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT:-http://casdoor:8000}
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID:?请在 .env 里设置 CASDOOR_CLIENT_ID（Casdoor 登录应用的 clientId）}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET:?请在 .env 里设置 CASDOOR_CLIENT_SECRET（Casdoor 登录应用的 clientSecret）}
      - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION:?请在 .env 里设置 CASDOOR_ORGANIZATION（Casdoor organization）}
      - CASDOOR_APPLICATION=${CASDOOR_APPLICATION:?请在 .env 里设置 CASDOOR_APPLICATION（Casdoor application）}
      - CASDOOR_REDIRECT_URI=${CASDOOR_REDIRECT_URI:?请在 .env 里设置 CASDOOR_REDIRECT_URI（Casdoor 登录回调地址，如 http://gateway:9923/api/v1/casdoor/callback）}
      - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE:?请在 .env 里设置 CASDOOR_CERTIFICATE（Casdoor 公钥证书 PEM，换行写成反斜杠 n）}
      # ===== 运行环境 / 会话 Cookie =====
      # 留空 = 不设置（Express 视为 development，JWT Cookie 不带 Secure 属性）。
      # 生产走 HTTPS 时必须设 NODE_ENV=production 或 JWT_COOKIE_SECURE=true，
      # 否则 cookie 的 secure 为 false；反过来对纯 HTTP 部署设 true 会让浏览器丢弃
      # cookie，表现为「登录成功但立刻 401」。
      - NODE_ENV=${NODE_ENV:-}
      - JWT_COOKIE_SECURE=${JWT_COOKIE_SECURE:-}
      # Redis 逻辑库编号（会话 / 缓存分库）
      - REDIS_DB=${REDIS_DB:-0}
      # Casdoor 应用内的 service 名（可选，空 = 不传）
      - CASDOOR_SERVICE=${CASDOOR_SERVICE:-}
      # Casdoor 回调后允许跳转的前端来源白名单（逗号分隔）；空 = 不做来源限制
      - CASDOOR_FRONTEND_ALLOWLIST=${CASDOOR_FRONTEND_ALLOWLIST:-}
      # 前端地址（Casdoor 回调缺省跳转目标）
      - FRONTEND_URL=${FRONTEND_URL:-}
      - TZ=${ENV_TZ:-Asia/Shanghai}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  casdoor:
    container_name: fastapi-casdoor
    image: casbin/casdoor:latest
    restart: unless-stopped
    ports:
      - "${CASDOOR_PORT:?请在 .env 里设置 CASDOOR_PORT（宿主机映射端口，容器内固定 8000）}:8000"
    volumes:
      - ./docker_vol/casdoor/conf/app.conf:/conf/app.conf
    environment:
      - TZ=${ENV_TZ:-Asia/Shanghai}
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rpa-browser:
    container_name: fastapi-rpa-browser
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: rpa
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - casdoor
    volumes:
      # 仅挂载源码子目录（容器内代码根目录为 /app）
      - ./RPA-Browser/app:/app/app
      - ./RPA-Browser/alembic:/app/alembic
      # 等级指纹配额配置（app/data/permissions.json，管理端「浏览器配额」页读写）：
      # 显式单独挂载（比外层 app 目录更具体，覆盖之），去掉源码挂载时也不会随容器重建丢失
      - ./RPA-Browser/app/data:/app/app/data
      # 签到奖励配置（app/data/sign_in_rewards.json，管理员自行编辑 / 管理端接口保存）：
      # 按 mtime 热加载，改完即时生效、无需重启；文件级挂载保证容器重建不丢配置
      - ./RPA-Browser/app/data/sign_in_rewards.json:/app/app/data/sign_in_rewards.json
      # 运行期下载的 chromium 落到宿主机目录持久化（避免被源码挂载覆盖、容器重建后丢失）
      - ./docker_vol/rpa/chrome_app:/app/app/chrome
      # 浏览器 user_data_dir（登录态/指纹 profile）落宿主机持久化，容器重建不丢
      - ./docker_vol/rpa/user_data_dir:/app/user_data_dir
      # 公共包源码：与 crawler / message 对齐，PYTHONPATH 含 /bili-common（见下 environment）。
      # 不挂载时 bili_common 只能来自镜像内 venv 的构建期副本（rpa 运行阶段没有 COPY /bili-common），
      # 改 bili-common 必须重建镜像才生效；挂载后改 bili-common 只需重建容器（docker compose up -d）。
      - ./bili-common:/bili-common
    ports:
      - "${RPA_BROWSER_PORT:?请在 .env 里设置 RPA_BROWSER_PORT（宿主机映射端口，容器内固定 28000）}:28000"
    environment:
      # ======================================================================
      # 本服务的配置**全部**在这里列出。RPA 镜像不含 .env.dev / .env.prod
      # （见 RPA-Browser/.dockerignore），代码侧 pydantic Settings 只依赖
      # 「进程环境变量 + 内置默认值」，所以「容器里到底有哪些键」以本段为唯一清单。
      #
      # 写法统一为 ${VAR:-代码默认值}：
      #   - .env 里没写 → 用这里的默认值（逐项对齐 app/config.py 的字段默认值）；
      #   - .env 里写了 → 覆盖；置空也回落默认值（避免空串让 int/bool 校验失败）。
      # 例外：JSON 数组字段（GITHUB_PROXY_URLS）与三态字段
      # （browser_session_expiration_time）不注入，保持代码默认，见对应注释。
      # ======================================================================

      # ---------- 1. 必填 ----------
      - mysql_browser_info_url=mysql+aiomysql://mysql/BiliRPADB?user=root&password=${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD（MySQL root 密码，mysql 容器与各服务共用）}
      # dev / prod：影响默认日志级别、MCP 端点是否挂载、会话行为；容器默认 prod
      - RUNNING_MODE=${RUNNING_MODE:-prod}

      # ---------- 2. 服务标识 / 接口路径 / 日志 ----------
      - controller_base_path=${CONTROLLER_BASE_PATH:-/api/v1/rpa}
      - admin_base_path=${ADMIN_BASE_PATH:-/api/admin/rpa}
      # be-message 服务地址（管理员身份判定 /api/v1/message/admin/me）
      - message_service_url=${MESSAGE_SERVICE_URL:-http://be-message-service:18739}
      # 业务日志（loguru）：DEBUG / INFO / WARNING / ERROR；与 crawler / message 共用同名变量
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - jwt_algorithm=${JWT_ALGORITHM:-HS256}
      - jwt_expire_minutes=${JWT_EXPIRE_MINUTES:-10080}
      - app_timezone=${APP_TIMEZONE:-Asia/Shanghai}
      # 服主 / 管理员 mid 列表（逗号分隔）：用户提交报错后实时推送的目标；空 = 只落库不推送
      - feedback_notify_mids=${FEEDBACK_NOTIFY_MIDS:-}
      # 推送标题 [服务名@地址]；空值分别回落内置服务名 / 容器 hostname
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ADDRESS=${SERVER_ADDRESS}

      # ---------- 3. 推送渠道 / 一言 ----------
      # 与 be-message-service / be-bilibili-crawler 共用同一份推送渠道配置（JSON），
      # 作为无 per-user 配置时的全局兜底
      - MESSAGE_CONFIG=${MESSAGE_CONFIG:?请在 .env 里设置 MESSAGE_CONFIG（推送渠道配置 JSON，留空会让各服务启动时 pydantic 校验失败）}
      - hitokoto_api_url=${HITOKOTO_API_URL:-https://v1.hitokoto.cn}
      - pushme_url=${PUSHME_URL:-https://push.i-i.me}
      - pushplus_url=${PUSHPLUS_URL:-http://www.pushplus.plus/send}

      # ---------- 4. 浏览器 / 虚拟显示 / 代理 ----------
      # 有头模式是反自动化检测的关键；服务器无物理显示器，必须靠 Xvfb 提供虚拟屏幕
      - xvfb_enabled=${XVFB_ENABLED:-true}
      - xvfb_display=${XVFB_DISPLAY:-:99}
      - xvfb_screen=${XVFB_SCREEN:-1920x1080x24}
      # chromium 可执行目录：必须与下面 volumes 的 chrome_app 挂载点一致，不建议改
      - chromium_executable_dir=/app/app/chrome
      - browser_max_pages_per_context=${BROWSER_MAX_PAGES_PER_CONTEXT:-10}
      # 浏览器指纹的默认出口代理：直接复用 crawler 的 PROXY_SERVER（根 .env 里配置），
      # 不再依赖本机 3128 的代理池，容器内也无需额外的 .env.dev
      - default_proxy_server=${PROXY_SERVER}
      # 代理绕过列表（逗号 / 分号分隔的 host 规则）：命中的主机直连；空 = 不绕过
      - browser_proxy_bypass=${BROWSER_PROXY_BYPASS:-}
      # 容器访问外网（首次下载 chromium、调用外部 API）用的代理
      - proxy_server_url=${PROXY_SERVER_URL:-http://host.docker.internal:10809}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-1234-2234-3234-4234}
      # github_proxy_urls（JSON 数组，chromium 下载加速镜像列表）：默认是代码内置的长列表，
      # 需要自定义时在 .env 写 GITHUB_PROXY_URLS=["http://127.0.0.1:7890"]，此处不注入。

      # ---------- 5. 浏览器启动准入（内存 / 排队 / 并发护栏） ----------
      - browser_launch_queue_enabled=${BROWSER_LAUNCH_QUEUE_ENABLED:-true}
      - browser_launch_min_available_memory_mb=${BROWSER_LAUNCH_MIN_AVAILABLE_MEMORY_MB:-1024}
      - browser_launch_reserved_memory_mb=${BROWSER_LAUNCH_RESERVED_MEMORY_MB:-768}
      - browser_launch_admit_cooldown_ms=${BROWSER_LAUNCH_ADMIT_COOLDOWN_MS:-1000}
      - browser_launch_queue_tick_interval_ms=${BROWSER_LAUNCH_QUEUE_TICK_INTERVAL_MS:-1000}
      # 排队最大等待（秒），0 = 不限
      - browser_launch_queue_max_wait_time=${BROWSER_LAUNCH_QUEUE_MAX_WAIT_TIME:-600}
      # 排队时长估算（ETA）采样窗口
      - browser_launch_eta_sample_window=${BROWSER_LAUNCH_ETA_SAMPLE_WINDOW:-20}
      - browser_launch_eta_min_samples=${BROWSER_LAUNCH_ETA_MIN_SAMPLES:-3}
      # 系统内存使用率红线（%）：超过一律不放行
      - browser_launch_max_memory_percent=${BROWSER_LAUNCH_MAX_MEMORY_PERCENT:-90.0}
      # 同时存在的浏览器实例上限，0 = 仅按内存限制
      - browser_max_concurrent_instances=${BROWSER_MAX_CONCURRENT_INSTANCES:-0}

      # ---------- 6. 浏览器内存实测校准（PSS 采样） ----------
      - browser_memory_estimate_enabled=${BROWSER_MEMORY_ESTIMATE_ENABLED:-true}
      - browser_memory_scan_interval=${BROWSER_MEMORY_SCAN_INTERVAL:-15}
      - browser_memory_post_launch_delay=${BROWSER_MEMORY_POST_LAUNCH_DELAY:-10}
      - browser_memory_sample_window=${BROWSER_MEMORY_SAMPLE_WINDOW:-20}
      - browser_memory_min_samples=${BROWSER_MEMORY_MIN_SAMPLES:-3}
      - browser_memory_safety_factor=${BROWSER_MEMORY_SAFETY_FACTOR:-1.1}
      - browser_memory_min_sample_mb=${BROWSER_MEMORY_MIN_SAMPLE_MB:-64}

      # ---------- 7. 浏览器会话生命周期 ----------
      - browser_session_auto_cleanup=${BROWSER_SESSION_AUTO_CLEANUP:-true}
      # 空闲超过该时长（秒）关实例出池；留空 = 用程序默认值（app/config.py）
      - browser_session_max_idle_time=${BROWSER_SESSION_MAX_IDLE_TIME:-}
      - browser_session_cleanup_interval=${BROWSER_SESSION_CLEANUP_INTERVAL:-60}
      # 闲置三级软着陆：须满足 degrade_after < suspend_after < max_idle_time，
      # 且 suspend_after + terminate_grace <= 5 分钟（闲置到关实例的总时长上限）
      - browser_stream_degrade_after=${BROWSER_STREAM_DEGRADE_AFTER:-60}
      - browser_stream_suspend_after=${BROWSER_STREAM_SUSPEND_AFTER:-180}
      - browser_session_terminate_grace=${BROWSER_SESSION_TERMINATE_GRACE:-60}
      # 会话状态 SSE 心跳（秒），必须小于网关空闲超时（180s）
      - browser_session_sse_heartbeat_interval=${BROWSER_SESSION_SSE_HEARTBEAT_INTERVAL:-15}
      # browser_session_expiration_time（会话绝对过期秒数，None=不过期）：留空即不过期，
      # 需要限制单会话最长寿命时在 .env 写 BROWSER_SESSION_EXPIRATION_TIME=3600 并在此追加。

      # ---------- 8. WebRTC 观看与码流档位 ----------
      # 单会话最大观看者数，0 = 不限制（每多一个观看者多编码一份 H264）
      - browser_webrtc_max_viewers=${BROWSER_WEBRTC_MAX_VIEWERS:-0}
      - browser_webrtc_viewer_idle_timeout=${BROWSER_WEBRTC_VIEWER_IDLE_TIMEOUT:-60}
      - browser_webrtc_viewer_reap_interval=${BROWSER_WEBRTC_VIEWER_REAP_INTERVAL:-20}
      - browser_webrtc_idle_timeout=${BROWSER_WEBRTC_IDLE_TIMEOUT:-300}
      # 原画档
      - browser_stream_original_quality=${BROWSER_STREAM_ORIGINAL_QUALITY:-100}
      - browser_stream_original_max_fps=${BROWSER_STREAM_ORIGINAL_MAX_FPS:-30}
      # 超清档
      - browser_stream_ultra_quality=${BROWSER_STREAM_ULTRA_QUALITY:-90}
      - browser_stream_ultra_max_fps=${BROWSER_STREAM_ULTRA_MAX_FPS:-30}
      - browser_stream_ultra_frame_max_width=${BROWSER_STREAM_ULTRA_FRAME_MAX_WIDTH:-1920}
      - browser_stream_ultra_frame_max_height=${BROWSER_STREAM_ULTRA_FRAME_MAX_HEIGHT:-1080}
      # 标清档
      - browser_stream_medium_quality=${BROWSER_STREAM_MEDIUM_QUALITY:-65}
      - browser_stream_medium_max_fps=${BROWSER_STREAM_MEDIUM_MAX_FPS:-15}
      - browser_stream_medium_frame_max_width=${BROWSER_STREAM_MEDIUM_FRAME_MAX_WIDTH:-960}
      - browser_stream_medium_frame_max_height=${BROWSER_STREAM_MEDIUM_FRAME_MAX_HEIGHT:-540}
      # 流畅档
      - browser_stream_degrade_quality=${BROWSER_STREAM_DEGRADE_QUALITY:-50}
      - browser_stream_degrade_max_fps=${BROWSER_STREAM_DEGRADE_MAX_FPS:-5}
      - browser_stream_degrade_frame_max_width=${BROWSER_STREAM_DEGRADE_FRAME_MAX_WIDTH:-640}
      - browser_stream_degrade_frame_max_height=${BROWSER_STREAM_DEGRADE_FRAME_MAX_HEIGHT:-360}

      # ---------- 9. 工作流执行 / 调度 / SSE ----------
      # 控制流（Loop / IfElse）最大嵌套深度
      - workflow_max_nesting_depth=${WORKFLOW_MAX_NESTING_DEPTH:-10}
      # 同浏览器工作流排队等待执行权的最长时长（秒）
      - workflow_queue_timeout_seconds=${WORKFLOW_QUEUE_TIMEOUT_SECONDS:-1800}
      # 定时任务运行中的计费心跳间隔（秒）
      - workflow_billing_heartbeat_interval=${WORKFLOW_BILLING_HEARTBEAT_INTERVAL:-300}
      # 僵尸运行收口：宽限期 + 扫描间隔（秒）
      - workflow_stale_run_grace_seconds=${WORKFLOW_STALE_RUN_GRACE_SECONDS:-600}
      - workflow_stale_run_reap_interval=${WORKFLOW_STALE_RUN_REAP_INTERVAL:-300}
      # 停止宽限期兜底（秒）
      - workflow_stop_grace_seconds=${WORKFLOW_STOP_GRACE_SECONDS:-30}
      - workflow_stop_scan_interval=${WORKFLOW_STOP_SCAN_INTERVAL:-10}
      # Fork 上游自动同步扫描间隔（秒）
      - workflow_upstream_sync_interval=${WORKFLOW_UPSTREAM_SYNC_INTERVAL:-600}
      # 运行进度 SSE
      - workflow_run_sse_heartbeat_interval=${WORKFLOW_RUN_SSE_HEARTBEAT_INTERVAL:-15}
      - workflow_run_progress_persist_interval=${WORKFLOW_RUN_PROGRESS_PERSIST_INTERVAL:-1.0}
      # 运行消息 detail 最大字符数，0 = 不裁剪
      - workflow_run_log_detail_max_length=${WORKFLOW_RUN_LOG_DETAIL_MAX_LENGTH:-0}
      # 容错熔断：一次运行中被 on_error=continue 跳过的失败步骤达到该数即判失败，0 = 关闭
      - workflow_tolerated_fail_failed_threshold=${WORKFLOW_TOLERATED_FAIL_FAILED_THRESHOLD:-10}
      # 重启断点恢复
      - workflow_resume_on_startup=${WORKFLOW_RESUME_ON_STARTUP:-true}
      - workflow_resume_max_count=${WORKFLOW_RESUME_MAX_COUNT:-3}
      - workflow_resume_max_age_seconds=${WORKFLOW_RESUME_MAX_AGE_SECONDS:-21600}
      # 运行结束是否回收浏览器：false = 只关页面，浏览器交给空闲回收（推荐）
      - workflow_release_browser_after_run=${WORKFLOW_RELEASE_BROWSER_AFTER_RUN:-false}

      # ---------- 10. 审批开关 ----------
      # 执行类操作（跑工作流 / 定时计划）是否强制先过审批单
      - require_approval_enabled=${REQUIRE_APPROVAL_ENABLED:-false}
      # 公开到社区是否强制先过 publish 审批单
      - require_publish_approval_enabled=${REQUIRE_PUBLISH_APPROVAL_ENABLED:-true}

      # ---------- 11. 雪花 ID（对外资源 ID） ----------
      # worker_id 多实例部署时必须互不相同，且各实体之间必须错开；
      # sequence_bits 变更会改变 ID 数值空间，仅限清库重建的环境调整
      - browser_id_epoch_sec=${BROWSER_ID_EPOCH_SEC:-1767196800}
      - browser_id_worker_id=${BROWSER_ID_WORKER_ID:-4}
      - browser_id_sequence_bits=${BROWSER_ID_SEQUENCE_BITS:-4}
      - action_id_epoch_sec=${ACTION_ID_EPOCH_SEC:-1767196800}
      - action_id_worker_id=${ACTION_ID_WORKER_ID:-5}
      - action_id_sequence_bits=${ACTION_ID_SEQUENCE_BITS:-4}
      - workflow_id_epoch_sec=${WORKFLOW_ID_EPOCH_SEC:-1767196800}
      - workflow_id_worker_id=${WORKFLOW_ID_WORKER_ID:-6}
      - workflow_id_sequence_bits=${WORKFLOW_ID_SEQUENCE_BITS:-4}

      # ---------- 12. 数据库迁移 ----------
      - alembic_auto_migrate=${ALEMBIC_AUTO_MIGRATE:-true}
      - alembic_upgrade_target=${ALEMBIC_UPGRADE_TARGET:-heads}

      # ---------- 13. 浏览器操作日志采集 ----------
      - action_log_default_enabled=${ACTION_LOG_DEFAULT_ENABLED:-false}
      - action_log_max_payload_length=${ACTION_LOG_MAX_PAYLOAD_LENGTH:-4000}
      # 保留天数，0 = 永久保留
      - action_log_default_retention_days=${ACTION_LOG_DEFAULT_RETENTION_DAYS:-7}
      - action_log_cleanup_interval=${ACTION_LOG_CLEANUP_INTERVAL:-86400}
      # 固定行数上限（0 = 不限制）：超限按时间列从旧到新删除
      - action_log_max_rows=${ACTION_LOG_MAX_ROWS:-2000000}
      - resource_record_max_rows=${RESOURCE_RECORD_MAX_ROWS:-2000000}
      - record_cap_delete_batch_size=${RECORD_CAP_DELETE_BATCH_SIZE:-10000}
      - resource_record_cleanup_interval=${RESOURCE_RECORD_CLEANUP_INTERVAL:-86400}
      # 日志投递走 RabbitMQ（失败自动回落同步直写）
      - action_log_use_mq=${ACTION_LOG_USE_MQ:-true}
      - action_log_mq_cooldown_seconds=${ACTION_LOG_MQ_COOLDOWN_SECONDS:-30.0}

      # ---------- 14. 剩余时长月度清零 ----------
      - duration_monthly_reset_enabled=${DURATION_MONTHLY_RESET_ENABLED:-true}

      # ---------- 15. RabbitMQ（RPC 调 crawler + 操作日志异步落库 + 后端串行调度） ----------
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER（RabbitMQ 账号）}:${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD（RabbitMQ 密码）}@rabbitmq:5672/

      # ---------- 16. Casdoor 支付对账（时长权益入账核验，详见 docs/浏览器使用时长与会员权益计划书.md §3.3） ----------
      # 复用根 .env 已有的管理员应用凭证（app-built-in），无需新增维护项
      - CASDOOR_ENDPOINT=${RPA_CASDOOR_ENDPOINT:-http://fastapi-casdoor:8000}
      - CASDOOR_CLIENT_ID=${CASDOOR_ADMIN_CLIENT_ID:?请在 .env 里设置 CASDOOR_ADMIN_CLIENT_ID（Casdoor 管理员应用 app-built-in 的 clientId）}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_ADMIN_CLIENT_SECRET:?请在 .env 里设置 CASDOOR_ADMIN_CLIENT_SECRET（Casdoor 管理员应用 app-built-in 的 clientSecret）}
      - casdoor_verify_timeout=${CASDOOR_VERIFY_TIMEOUT:-5.0}

      # ---------- 17. MCP 端点（app/mcp/config.py，前缀 RPA_MCP_） ----------
      # 是否挂载 MCP 端点：默认 prod 关闭、dev 开启；容器按 prod 处理
      - RPA_MCP_ENABLED=${RPA_MCP_ENABLED:-false}
      - RPA_MCP_MOUNT_SUFFIX=${RPA_MCP_MOUNT_SUFFIX:-/mcp}
      - RPA_MCP_POLL_INTERVAL=${RPA_MCP_POLL_INTERVAL:-1.5}
      - RPA_MCP_MAX_WAIT_SECONDS=${RPA_MCP_MAX_WAIT_SECONDS:-300}
      - RPA_MCP_PAYLOAD_MAX_CHARS=${RPA_MCP_PAYLOAD_MAX_CHARS:-1200}
      # 额外排除暴露的 operationId（逗号分隔）
      - RPA_MCP_EXCLUDE_OPERATIONS=${RPA_MCP_EXCLUDE_OPERATIONS:-}

      # ---------- 18. 运行时环境（由镜像 / 挂载决定，不要随意改） ----------
      # /bili-common 优先于 venv/site-packages 里的 bili_common，使宿主 bili-common
      # 源码改动重启即生效（与 be-bilibili-crawler / be-message-service 一致）。
      # 镜像内 PYTHONPATH 只有 /app，这里必须显式补上 /bili-common。
      - PYTHONPATH=/app:/bili-common
      - TZ=${ENV_TZ:-Asia/Shanghai}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  be-message-service:
    container_name: be-message-service
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: message
    volumes:
      - ./be-message-service/app:/app/app
      # Alembic 迁移（启动时自动 upgrade head）。message 镜像只 COPY 了 app 包，
      # 根目录的 ini 与脚本目录都不在镜像里，必须挂载；缺 alembic.ini 时迁移会
      # 因 FileNotFoundError 被兜底捕获（只打 error 日志），表现为「静默不迁移」。
      - ./be-message-service/alembic.ini:/app/alembic.ini
      - ./be-message-service/alembic:/app/alembic
      # pptr Postgres 用户库（PPTR_Bili_Lot）是独立 Alembic 分支，单独挂载
      - ./be-message-service/alembic_pptr.ini:/app/alembic_pptr.ini
      - ./be-message-service/alembic_pptr:/app/alembic_pptr
      # 内容审核词库（data/sensitive-words：三层词库 / 分类词库 / whitelist / 域名名单）。
      # 不挂载时容器内无该目录，审核引擎会按弱依赖降级成空词库（全部放行）。
      - ./be-message-service/data:/app/data
      # GeoIP 属地库（GeoLite2 mmdb），统一放 docker_vol 底下
      - ./docker_vol/geoip/mmdb:/app/mmdb
      # 公共包源码：与 crawler 对齐，PYTHONPATH 含 /bili-common（见下 environment）。
      # 不挂载时 bili_common 只能来自镜像内 venv 的构建期副本；一旦 bili-common 有
      # 变更而 app 已挂载（宿主新代码 + 镜像旧 bili_common），启动即 ImportError：
      #   cannot import name 'auto_str' from 'bili_common.models.auto_str'
      # 挂载后改 bili-common 只需 `docker compose up -d` 重建容器，无需重建镜像。
      - ./bili-common:/bili-common
    ports:
      - "${MESSAGE_SERVICE_PORT:?请在 .env 里设置 MESSAGE_SERVICE_PORT（宿主机映射端口，容器内固定 18739）}:18739"
    depends_on:
      - rabbitmq
      - mysql
      - casdoor
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?请在 .env 里设置 RABBITMQ_USER（RabbitMQ 账号）}:${RABBITMQ_PASSWORD:?请在 .env 里设置 RABBITMQ_PASSWORD（RabbitMQ 密码）}@rabbitmq:5672/?heartbeat=180
      # 业务日志等级（loguru，只输出 stderr、不写文件；生产默认 WARNING 只打印告警，开发可设 DEBUG）
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # 消息系统主库（元数据库）：系统通知 / 事件提醒 / 私信索引与会话 / 消息设置
      # 私信「内容」不在此库，而是按月分库 bili_msg_content_YYYYMM + 库内 100 张分表
      - MYSQL_MESSAGE_URL=mysql+aiomysql://root:${MYSQL_PASSWORD:?请在 .env 里设置 MYSQL_PASSWORD（MySQL root 密码，mysql 容器与各服务共用）}@mysql:3306/BiliMessageDB?charset=utf8mb4
      # 直连 pptr 的 Postgres（PPTR_Bili_Lot）只读取用户展示信息与 @ 搜索，不写入
      - POSTGRES_PPTR_URL=postgresql+asyncpg://${POSTGRES_USER:?请在 .env 里设置 POSTGRES_USER（Postgres 账号）}:${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD（Postgres 密码）}@${POSTGRES_HOST:-postgres}:5432/PPTR_Bili_Lot
      # 与 be-bilibili-crawler / rpa-browser 共用同一份推送渠道配置（JSON）
      - MESSAGE_CONFIG=${MESSAGE_CONFIG:?请在 .env 里设置 MESSAGE_CONFIG（推送渠道配置 JSON，留空会让各服务启动时 pydantic 校验失败）}
      # 抽奖卡片只读查询（热门抽奖榜 / 首页轮播一次返回卡片数据）
      - CRAWLER_QUERY_BASE_URL=http://be-bilibili-crawler-query:23336
      # crawler 写服务：管理端「LLM 配置」页代理 /llm/*（crawler 侧无鉴权、网关不转发）
      - CRAWLER_BASE_URL=http://be-bilibili-crawler:23333
      # Casdoor OAuth2 配置（与 gateway 共用同一套 Casdoor 应用）
      - CASDOOR_ENABLED=true
      - CASDOOR_ENDPOINT=http://fastapi-casdoor:8000
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID:?请在 .env 里设置 CASDOOR_CLIENT_ID（Casdoor 登录应用的 clientId）}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET:?请在 .env 里设置 CASDOOR_CLIENT_SECRET（Casdoor 登录应用的 clientSecret）}
      - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION:?请在 .env 里设置 CASDOOR_ORGANIZATION（Casdoor organization）}
      - CASDOOR_APPLICATION=${CASDOOR_APPLICATION:?请在 .env 里设置 CASDOOR_APPLICATION（Casdoor application）}
      - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE:?请在 .env 里设置 CASDOOR_CERTIFICATE（Casdoor 公钥证书 PEM，换行写成反斜杠 n）}
      # Casdoor 管理员账号（查询用户信息用，password grant 换 admin token）
      # 管理员走内置 application「app-built-in」，clientId/clientSecret 与普通登录应用不同
      - CASDOOR_ADMIN_NAME=${CASDOOR_ADMIN_NAME:?请在 .env 里设置 CASDOOR_ADMIN_NAME（Casdoor 管理员用户名）}
      - CASDOOR_ADMIN_PASSWORD=${CASDOOR_ADMIN_PASSWORD:?请在 .env 里设置 CASDOOR_ADMIN_PASSWORD（Casdoor 管理员密码）}
      - CASDOOR_ADMIN_CLIENT_ID=${CASDOOR_ADMIN_CLIENT_ID:?请在 .env 里设置 CASDOOR_ADMIN_CLIENT_ID（Casdoor 管理员应用 app-built-in 的 clientId）}
      - CASDOOR_ADMIN_CLIENT_SECRET=${CASDOOR_ADMIN_CLIENT_SECRET:?请在 .env 里设置 CASDOOR_ADMIN_CLIENT_SECRET（Casdoor 管理员应用 app-built-in 的 clientSecret）}
      # GeoIP 属地库目录（与挂载点一致）
      - GEOIP_MMDB_DIR=/app/mmdb
      # ===== 覆盖宿主机 app/.env 的开发值 =====
      # message 容器把 ./be-message-service/app 整目录挂到 /app/app，而 Settings 的
      # env_file=("app/.env",) 会读到宿主机那份**开发**配置（localhost、DEBUG、
      # 放宽的 ID 位宽 / 每日限额）。env_file 的键必须在这里显式覆盖，否则容器会带着
      # 开发值启动（曾出现 MOMENT_ID_SEQUENCE_BITS=14、日限额 9999999、APP_ENV=development）。
      - APP_ENV=${APP_ENV:-production}
      - LOG_FILE_DIR=${LOG_FILE_DIR:-logs}
      # FastStream（RabbitMQ 框架）自身日志级别，与业务日志 LOG_LEVEL 相互独立
      - FASTSTREAM_LOG_LEVEL=${FASTSTREAM_LOG_LEVEL:-WARNING}
      # AsgiFastStream 健康检查监听地址（容器内固定 18739，与 ports 映射一致）
      - HTTP_HOST=${HTTP_HOST:-0.0.0.0}
      - HTTP_PORT=18739
      - MYSQL_POOL_SIZE=${MYSQL_POOL_SIZE:-10}
      - MYSQL_MAX_OVERFLOW=${MYSQL_MAX_OVERFLOW:-15}
      - MYSQL_POOL_RECYCLE=${MYSQL_POOL_RECYCLE:-300}
      - MYSQL_ECHO=${MYSQL_ECHO:-false}
      - POSTGRES_PPTR_SCHEMA=${POSTGRES_PPTR_SCHEMA:-public}
      - POSTGRES_PPTR_POOL_SIZE=${POSTGRES_PPTR_POOL_SIZE:-10}
      - POSTGRES_PPTR_MAX_OVERFLOW=${POSTGRES_PPTR_MAX_OVERFLOW:-20}
      # 雪花 ID：worker_id 多实例部署必须互不相同；sequence_bits 仅清库重建时可调
      - MSGKEY_WORKER_ID=${MSGKEY_WORKER_ID:-1}
      - UID_WORKER_ID=${UID_WORKER_ID:-1}
      - UID_SEQUENCE_BITS=${UID_SEQUENCE_BITS:-4}
      - MOMENT_ID_WORKER_ID=${MOMENT_ID_WORKER_ID:-2}
      - MOMENT_ID_SEQUENCE_BITS=${MOMENT_ID_SEQUENCE_BITS:-4}
      - TOPIC_ID_WORKER_ID=${TOPIC_ID_WORKER_ID:-3}
      - TOPIC_ID_SEQUENCE_BITS=${TOPIC_ID_SEQUENCE_BITS:-4}
      # 内容发布每日上限（0 = 不限制）
      - COMMENT_DAILY_CREATE_LIMIT=${COMMENT_DAILY_CREATE_LIMIT:-100}
      - MOMENT_DAILY_CREATE_LIMIT=${MOMENT_DAILY_CREATE_LIMIT:-30}
      - TOPIC_DAILY_CREATE_LIMIT=${TOPIC_DAILY_CREATE_LIMIT:-10}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - ALEMBIC_AUTO_MIGRATE=${ALEMBIC_AUTO_MIGRATE:-true}
      # JWT 与前端地址：JWT_SECRET 必须与网关 / pptr 侧一致，不一致表现为「登录后立刻 401」
      - JWT_SECRET=${JWT_SECRET:-关注永雏塔菲喵，关注永雏塔菲谢谢喵！114514}
      - JWT_EXPIRES_SECONDS=${JWT_EXPIRES_SECONDS:-1296000}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - CASDOOR_SERVICE=${CASDOOR_SERVICE:-}
      - TZ=${ENV_TZ:-Asia/Shanghai}
      # /bili-common 优先于 venv/site-packages 里的 bili_common，使宿主 bili-common
      # 源码改动重启即生效（与 be-bilibili-crawler 一致）
      - PYTHONPATH=/app:/bili-common
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 关闭容器健康检查：原 30s 一次的 /health 探活会持续刷 uvicorn 访问日志，
      # 且无任何服务以 service_healthy 依赖它。探活能力由 /health 路由本身保留
      # （be-bilibili-crawler 启动期仍会探测一次），只是不再由 Docker 定时调用。
      disable: true
  llama_cpp:
    image: ghcr.nju.edu.cn/ggml-org/llama.cpp:server
    container_name: llama_cpp
    volumes:
      - ./docker_vol/llama/models.ini:/models.ini
      - ./docker_vol/llama_model/cache:/root/.cache
    ports:
      - "${LLAMA_PORT:?请在 .env 里设置 LLAMA_PORT（宿主机映射端口，容器内固定 8080）}:8080"
    restart: unless-stopped
    environment:
      - LLAMA_ARG_MODELS_PRESET=/models.ini
      - LLAMA_ARG_MODELS_MAX=1
      - HF_ENDPOINT=https://hf-mirror.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
  # 说明：本编排只保留 CPU 版 llama.cpp（llama_cpp）。
  # 原先的 GPU 版（llama_cpp_gpu_cuda / server-cuda13）已移除：
  # 它带 nvidia device reservation，在没有 nvidia 容器运行时的机器上会让
  # 整个 `docker compose up -d` 因 "could not select device driver nvidia" 直接中断。
  # 如需 GPU 推理，请单独拉起该服务，或使用 docker-compose.dev.yml 的 `--profile gpu`。
  # ===== IPv6 代理池（go-proxy-ipv6-pool-auto）=====
  # 该代理每次请求从「出口网卡（程序自动探测，可用 .env 的 NET_IF 覆盖）」的 /64 前缀里随机生成源
  # 地址拨号（伪装成池子里不同 IP），
  # 依赖两项宿主内核态前置条件（见 scripts/docker/go-proxy-entrypoint.sh）：
  #   1. net.ipv6.ip_nonlocal_bind = 1  ← 宿主重启后回落为 0，必须由容器启动时补
  #   2. ip -6 route replace local <prefix>::/64 dev lo（代理自己也会做，脚本兜底并守护）
  # 因此这里必须给 privileged（写宿主 network namespace 的 /proc/sys 与路由表）
  # 且使用 host 网络（代理的 NDP 代答、3138/3129 端口都直接落在宿主）。
  # 镜像由本服务自己构建（Dockerfile 在子目录 go-proxy-ipv6-pool-auto 里），
  # 直接用 `docker compose up -d --build go-proxy-server` 即可构建并重建，
  # 不必先跑去子项目构建一次镜像。
  #
  # ⚠️ 该服务挂在独立 profile `ipv6-proxy` 下，默认 `docker compose up -d` **不会**起它：
  #    - 只在「持有公网 IPv6 前缀、且独占代答」的那台机器上跑（目前是生产端）；
  #    - 同一个 /64 上跑两个实例会互相抢答 NDP，光猫邻居缓存被对方覆盖 → 对方所有随机
  #      出口都 i/o timeout，而且停掉一台后还要等缓存过期（几分钟）才恢复；
  #    - 本机如需临时跑，必须先用 POOL_PREFIX 划分子段（见 README），不能直接照样起。
  # 手动起：docker compose up -d --build go-proxy-server（显式指定服务名会忽略 profile）
  go-proxy-server:
    profiles: ["ipv6-proxy"]
    container_name: go-proxy-server
    build:
      # 构建上下文是子项目目录：Dockerfile 里的 COPY go-proxy-ipv6-pool/... 依赖这个根，
      # 上下文与 .dockerignore 也都在这层（bin/ 不会被塞进构建上下文）。
      context: ./go-proxy-ipv6-pool-auto
      dockerfile: Dockerfile
    # 显式指定镜像名：不加的话会按「项目名-服务名」生成，与历史镜像名不一致（等于每次都重建新名字）。
    image: go-proxy-ipv6-pool-auto-go-proxy-server
    # 该镜像从未推送到任何 registry。默认 pull_policy=missing 时，只要本地 tag 解析不到，
    # compose 就会去 registry-1.docker.io 拉，卡 ~35s 后报
    # `Error Get "https://registry-1.docker.io/v2/": context deadline exceeded`。
    # never：永远不碰远端，缺镜像就用上面的 build 现做（只 build 不 pull）。
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      # NET_IF 只是可选覆盖：每台机器网卡名不一样（eth0 / enp3s0 / ens18 …），
      # 留空时由容器内的程序自己探测（默认 IPv6 路由 → 带公网 IPv6 的物理网卡，排除虚拟网卡）。
      - NET_IF=${NET_IF:-}
      - RUN_ENV=prod
      # 复查间隔（秒）：只读探测，只在缺失/前缀变化时才写入（写入会触发
      # netlink 变更通知，浏览器会判定网络变更 → ERR_NETWORK_CHANGED）
      - POOL_CHECK_INTERVAL=${GO_PROXY_CHECK_INTERVAL:-300}
      - TZ=${ENV_TZ:-Asia/Shanghai}
    volumes:
      - ./scripts/docker/go-proxy-entrypoint.sh:/app/entrypoint.sh:ro
      # 注意：这里**不要**再挂载 go-proxy-ipv6-pool-auto/bin 到 /opt/bin。
      # 二进制统一由镜像构建阶段编译（Dockerfile 里 COPY 源码 + golang 层 build），
      # 挂了宿主 bin 会盖掉镜像里的版本，于是「build 了却没生效」，还得手动回填二进制。
      # 改完 Go 代码只需：docker compose up -d --build go-proxy-server
      #
      # 运行期只 bind 随机源地址、不对网卡做 addr add/del —— 旧版每次请求都改地址，会让 Chromium
      # 判定「网络已变更」并中断请求（ERR_NETWORK_CHANGED）。
    command: ["/bin/sh", "/app/entrypoint.sh"]
volumes:
  be-gateway_node_modules:
networks:
  default:
    enable_ipv6: true
    name: fastapi
    driver: bridge
