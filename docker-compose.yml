services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./docker_vol/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./docker_vol/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0-beta
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./docker_vol/milvus/data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mysql:
    container_name: fastapi-mysql
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/mysql_data/conf.d:/etc/mysql/conf.d # 配置文件目录
      - ./docker_vol/mysql_data/data:/var/lib/mysql  # 数据文件目录
    ports:
      - "${MYSQL_PORT}:3306" # 指定宿主机端口与容器端口映射关系，宿主机:容器
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    container_name: fastapi-redis
    image: redis:latest
    environment:
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/redis/data:/data
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rabbitmq:
    container_name: fastapi-rabbitmq
    image: rabbitmq:management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_WEBUI_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/rabbitmq/data:/var/lib/rabbitmq
      - ./docker_vol/rabbitmq/logs:/var/log/rabbitmq
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  unidbg:
    container_name: fastapi-unidbg
    image: unidbg-springboot-samsclub
    environment:
      - TZ=${ENV_TZ}
    ports:
      - "${UNIDBG_PORT}:23335"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  fastapi:
    deploy:
      resources:
        limits:
          memory: 5G
    container_name: fastapi-bili-explosion
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - unidbg
      - lm-studio
    environment:
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - UNIDBG_HOST=unidbg
      - LMSTUDIO_HOST=lm-studio
      - MILVUS_HOST=standalone
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - PUSHME_TOKEN=${PUSHME_TOKEN}
      - PUSHPLUS_TOKEN=${PUSHPLUS_TOKEN}
      - PROXY_SERVER=${PROXY_SERVER}
      - V2RAY_HOST=${V2RAY_HOST}
      - TZ=${ENV_TZ}
      - SHOW_LOG=${FASTAPI_SHOW_LOG}
      - IS_DEV=${IS_DEV}
      - llm_apis=${llm_apis}
    build:
      context: ./FastapiApp
    volumes:
      - ./FastapiApp:/app
      - /app/node_modules # 保护容器内node_modules
      - ./docker_vol/fastapi/log:/app/scripts/log
    ports:
      - "${FASTAPI_PORT}:23333"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    container_name: postgres
    image: postgres:alpine3.22
    volumes:
      - ./docker_vol/postgres/data:/var/lib/postgresql
      - ./docker_vol/postgres/init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - TZ=${ENV_TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  nodejs-pptr:
    container_name: nodejs-pptr
    depends_on:
      - postgres
      - redis
      - casdoor
    build:
      context: ./puppeteer_Bili
      target: prod
    volumes:
      - puppeteer_Bili_node_modules:/app/node_modules # 使用命名卷保存 node_modules
      - ./puppeteer_Bili:/app
    ports:
      - "${NODEJS_PPTR_PORT}:9923"
    restart: unless-stopped
    environment:
      - DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/PPTR_Bili_Lot
      - DEV_DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/DEV_PPTR_Bili_Lot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PWD=
      - FASTAPI_URI=http://fastapi-bili-explosion:23333
      - FASTAPI_DEV_URI=http://fastapi-bili-explosion:23333
      - FASTAPI_RPA_URI=http://fastapi-rpa-browser:8000
      - FASTAPI_RPA_DEV_URI=http://fastapi-rpa-browser:8000
      - CASDOOR_ENABLED=true
      - CASDOOR_ENDPOINT=http://casdoor:8000
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION}
      - CASDOOR_APPLICATION=${CASDOOR_APPLICATION}
      - CASDOOR_REDIRECT_URI=${CASDOOR_REDIRECT_URI}
      - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE}
      - OLLAMA_ENDPOINT=http://ollama:10013
      - TZ=${ENV_TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  lm-studio:
    container_name: fastapi-lm-studio
    build:
      context: ./docker_vol/lm_studio
    mem_limit: 1g
    volumes:
      - /root/.lmstudio/models
    ports:
      - ${LMSTUDIO_PORT}:1234
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  casdoor:
    container_name: fastapi-casdoor
    image: casbin/casdoor:latest
    restart: unless-stopped
    ports:
      - "${CASDOOR_PORT}:8000"
    volumes:
      - ./docker_vol/casdoor/conf/app.conf:/conf/app.conf
    environment:
      - TZ=${ENV_TZ}
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rpa-browser:
    container_name: fastapi-rpa-browser
    build:
      context: ./RPA-Browser
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - casdoor
    ports:
      - "${RPA_BROWSER_PORT}:8000"
    environment:
      - mysql_browser_info_url=mysql+aiomysql://mysql/BiliRPADB?user=root&password=${MYSQL_PASSWORD}
      - controller_base_path=/api/v1/rpa
      - proxy_server_url=http://host.docker.internal:10809
      - GEMINI_API_KEY=1234-2234-3234-4234
      # RabbitMQ RPC 调用 FastapiApp（auto_attach_auth 模式依赖）
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - TZ=${ENV_TZ}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  ollama:
    container_name: ollama_container
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ./docker_vol/ollama/data:/root/.ollama
    ports:
      - "${Ollama_PORT}:11434"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KV_CACHE_TYPE=q4_0
      - HF_ENDPOINT=https://hf-mirror.com
      - TZ=${ENV_TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  puppeteer_Bili_node_modules:
networks:
  default:
    enable_ipv6: true
    name: fastapi
    driver: bridge
