services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./docker_vol/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ./docker_vol/milvus/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0-beta
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ./docker_vol/milvus/data:/var/lib/milvus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT}:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  mysql:
    container_name: fastapi-mysql
    image: mysql:lts
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/mysql_data/conf.d:/etc/mysql/conf.d # 配置文件目录
      - ./docker_vol/mysql_data/data:/var/lib/mysql # 数据文件目录
    ports:
      - "${MYSQL_PORT}:3306" # 指定宿主机端口与容器端口映射关系，宿主机:容器
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  redis:
    container_name: fastapi-redis
    image: redis:latest
    environment:
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/redis/data:/data
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rabbitmq:
    container_name: fastapi-rabbitmq
    image: rabbitmq:management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_WEBUI_PORT}:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - TZ=${ENV_TZ}
    volumes:
      - ./docker_vol/rabbitmq/data:/var/lib/rabbitmq
      - ./docker_vol/rabbitmq/logs:/var/log/rabbitmq
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  unidbg:
    container_name: fastapi-unidbg
    image: unidbg-springboot-samsclub
    environment:
      - TZ=${ENV_TZ}
    ports:
      - "${UNIDBG_PORT}:23335"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  be-bilibili-crawler:
    deploy:
      resources:
        limits:
          memory: 5G
    container_name: be-bilibili-crawler
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - unidbg
    environment:
      - MYSQL_HOST=mysql
      # CONFIG.py 的 env_file 是 (.env.fastapi.prod, .env.fastapi.dev)，pydantic-settings
      # 后者覆盖前者；源码 bind mount 后宿主机上的 .env.fastapi.dev 也会进容器
      # （镜像里它被 .dockerignore 排除），于是 dev 的「宿主机视角」值会盖掉 prod 的
      # 「容器视角」值（dev: MYSQL_PORT=10000 / LLAMA_HOST=localhost / LLAMA_PORT=10009）。
      # 环境变量优先级最高，容器视角的键必须在这里显式给出。
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - UNIDBG_HOST=unidbg
      - MILVUS_HOST=standalone
      - MESSAGE_SERVICE_HOST=be-message-service
      - MESSAGE_SERVICE_PORT=18739
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MESSAGE_CONFIG=${MESSAGE_CONFIG}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - PROXY_SERVER=${PROXY_SERVER}
      - V2RAY_HOST=${V2RAY_HOST}
      - TZ=${ENV_TZ}
      - SHOW_LOG=${FASTAPI_SHOW_LOG}
      - IS_DEV=${IS_DEV}
      - llm_apis=${llm_apis}
      # 同上的原因：这三项在 .env.fastapi.dev 里是宿主机视角（localhost / 10009 / True），
      # 会覆盖 prod 文件里的容器视角值
      - LLAMA_HOST=llama_cpp
      - LLAMA_PORT=8080
      - sqlalchemy_logging=False
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: crawler
    # 源码整目录 bind mount 到 /app，与 be-message-service 对齐：
    # 改完代码 `docker compose restart be-bilibili-crawler` 即生效，无需重建镜像。
    # 前提：构建期已把 node_modules 外移到 /opt/node_modules（见 Dockerfile.mono），
    # 否则宿主机目录会顶掉容器内的 node_modules，execjs 的 require('jsdom'/'md5') 会失败；
    # 虚拟环境同样在 /app 之外（UV_PROJECT_ENVIRONMENT=/opt/venv），不受挂载影响。
    volumes:
      # 源码（容器内代码根目录 /app，入口 uvicorn main:app）
      - ./be-bilibili-crawler:/app
      # 公共包源码：PYTHONPATH 含 /bili-common，改 bili-common 同样重启即生效
      - ./bili-common:/bili-common
      # 运行期日志落宿主机（容器内外都要可见；子路径挂载优先于父路径 /app）
      - ./docker_vol/fastapi/log:/app/scripts/log
    develop:
      watch:
        # 源码已 bind mount，不再需要 sync+restart；只有依赖变了才重建镜像
        # （uv sync --locked 在构建期跑，venv 随镜像更新）
        - action: rebuild
          path: ./be-bilibili-crawler/uv.lock
        - action: rebuild
          path: ./be-bilibili-crawler/pyproject.toml
    ports:
      - "${FASTAPI_PORT}:23333"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  postgres:
    container_name: postgres
    image: postgres:alpine3.22
    volumes:
      - ./docker_vol/postgres/data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - TZ=${ENV_TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  gateway:
    container_name: gateway
    depends_on:
      - postgres
      - redis
      - casdoor
    build:
      context: ./be-gateway
      target: prod
    volumes:
      - be-gateway_node_modules:/app/node_modules # 使用命名卷保存 node_modules
      - ./be-gateway:/app
    ports:
      - "${NODEJS_PPTR_PORT}:9923"
    restart: unless-stopped
    environment:
      - DB=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/PPTR_Bili_Lot
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PWD=
      - BILI_CRAWLER_URI=${BILI_CRAWLER_URI}
      - RPA_SERVICE_URI=${RPA_SERVICE_URI}
      - MESSAGE_SERVICE_URI=${MESSAGE_SERVICE_URI}
      - CASDOOR_ENABLED=true
      - CASDOOR_ENDPOINT=${CASDOOR_ENDPOINT}
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION}
      - CASDOOR_APPLICATION=${CASDOOR_APPLICATION}
      - CASDOOR_REDIRECT_URI=${CASDOOR_REDIRECT_URI}
      - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE}
      - TZ=${ENV_TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
  casdoor:
    container_name: fastapi-casdoor
    image: casbin/casdoor:latest
    restart: unless-stopped
    ports:
      - "${CASDOOR_PORT}:8000"
    volumes:
      - ./docker_vol/casdoor/conf/app.conf:/conf/app.conf
    environment:
      - TZ=${ENV_TZ}
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
  rpa-browser:
    container_name: fastapi-rpa-browser
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: rpa
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - casdoor
    volumes:
      # 仅挂载源码子目录（容器内代码根目录为 /app）
      - ./RPA-Browser/app:/app/app
      - ./RPA-Browser/alembic:/app/alembic
      # 运行期下载的 chromium 落到宿主机目录持久化（避免被源码挂载覆盖、容器重建后丢失）
      - ./docker_vol/rpa/chrome_app:/app/app/chrome
      # 浏览器 user_data_dir（登录态/指纹 profile）落宿主机持久化，容器重建不丢
      - ./docker_vol/rpa/user_data_dir:/app/user_data_dir
    ports:
      - "${RPA_BROWSER_PORT}:28000"
    environment:
      - mysql_browser_info_url=mysql+aiomysql://mysql/BiliRPADB?user=root&password=${MYSQL_PASSWORD}
      - controller_base_path=/api/v1/rpa
      - proxy_server_url=http://host.docker.internal:10809
      - GEMINI_API_KEY=1234-2234-3234-4234
      # RabbitMQ RPC 调用 be-bilibili-crawler（auto_attach_auth 模式依赖）
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      # be-message 服务地址（管理员身份判定 /api/v1/message/admin/me）
      - message_service_url=http://be-message-service:18739
      # 与 be-message-service / be-bilibili-crawler 共用同一份推送渠道配置（JSON），作为无 per-user 配置时的全局兜底
      - MESSAGE_CONFIG=${MESSAGE_CONFIG}
      - SERVER_NAME=${SERVER_NAME}
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - TZ=${ENV_TZ}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
  be-message-service:
    container_name: be-message-service
    build:
      context: .
      dockerfile: ./Dockerfile.mono
      target: message
    volumes:
      - ./be-message-service/app:/app/app
      # Alembic 迁移（启动时自动 upgrade head）。message 镜像只 COPY 了 app 包，
      # 根目录的 ini 与脚本目录都不在镜像里，必须挂载；缺 alembic.ini 时迁移会
      # 因 FileNotFoundError 被兜底捕获（只打 error 日志），表现为「静默不迁移」。
      - ./be-message-service/alembic.ini:/app/alembic.ini
      - ./be-message-service/alembic:/app/alembic
      # pptr Postgres 用户库（PPTR_Bili_Lot）是独立 Alembic 分支，单独挂载
      - ./be-message-service/alembic_pptr.ini:/app/alembic_pptr.ini
      - ./be-message-service/alembic_pptr:/app/alembic_pptr
      # 内容审核词库（data/sensitive-words：三层词库 / 分类词库 / whitelist / 域名名单）。
      # 不挂载时容器内无该目录，审核引擎会按弱依赖降级成空词库（全部放行）。
      - ./be-message-service/data:/app/data
      # GeoIP 属地库（GeoLite2 mmdb），统一放 docker_vol 底下
      - ./docker_vol/geoip/mmdb:/app/mmdb
      # 公共包源码：与 crawler 对齐，PYTHONPATH 含 /bili-common（见下 environment）。
      # 不挂载时 bili_common 只能来自镜像内 venv 的构建期副本；一旦 bili-common 有
      # 变更而 app 已挂载（宿主新代码 + 镜像旧 bili_common），启动即 ImportError：
      #   cannot import name 'auto_str' from 'bili_common.models.auto_str'
      # 挂载后改 bili-common 只需 `docker compose up -d` 重建容器，无需重建镜像。
      - ./bili-common:/bili-common
    ports:
      - "${MESSAGE_SERVICE_PORT}:18739"
    depends_on:
      - rabbitmq
      - mysql
      - casdoor
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/?heartbeat=180
      # 业务日志等级（loguru，只输出 stderr、不写文件；生产默认 WARNING 只打印告警，开发可设 DEBUG）
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      # 消息系统主库（元数据库）：系统通知 / 事件提醒 / 私信索引与会话 / 消息设置
      # 私信「内容」不在此库，而是按月分库 bili_msg_content_YYYYMM + 库内 100 张分表
      - MYSQL_MESSAGE_URL=mysql+aiomysql://root:${MYSQL_PASSWORD}@mysql:3306/BiliMessageDB?charset=utf8mb4
      # 直连 pptr 的 Postgres（PPTR_Bili_Lot）只读取用户展示信息与 @ 搜索，不写入
      - POSTGRES_PPTR_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/PPTR_Bili_Lot
      # 与 be-bilibili-crawler / rpa-browser 共用同一份推送渠道配置（JSON）
      - MESSAGE_CONFIG=${MESSAGE_CONFIG}
      # Casdoor OAuth2 配置（与 gateway 共用同一套 Casdoor 应用）
      - CASDOOR_ENABLED=true
      - CASDOOR_ENDPOINT=http://fastapi-casdoor:8000
      - CASDOOR_CLIENT_ID=${CASDOOR_CLIENT_ID}
      - CASDOOR_CLIENT_SECRET=${CASDOOR_CLIENT_SECRET}
      - CASDOOR_ORGANIZATION=${CASDOOR_ORGANIZATION}
      - CASDOOR_APPLICATION=${CASDOOR_APPLICATION}
      - CASDOOR_CERTIFICATE=${CASDOOR_CERTIFICATE}
      # Casdoor 管理员账号（查询用户信息用，password grant 换 admin token）
      # 管理员走内置 application「app-built-in」，clientId/clientSecret 与普通登录应用不同
      - CASDOOR_ADMIN_NAME=${CASDOOR_ADMIN_NAME}
      - CASDOOR_ADMIN_PASSWORD=${CASDOOR_ADMIN_PASSWORD}
      - CASDOOR_ADMIN_CLIENT_ID=${CASDOOR_ADMIN_CLIENT_ID}
      - CASDOOR_ADMIN_CLIENT_SECRET=${CASDOOR_ADMIN_CLIENT_SECRET}
      # GeoIP 属地库目录（与挂载点一致）
      - GEOIP_MMDB_DIR=/app/mmdb
      - TZ=${ENV_TZ}
      # /bili-common 优先于 venv/site-packages 里的 bili_common，使宿主 bili-common
      # 源码改动重启即生效（与 be-bilibili-crawler 一致）
      - PYTHONPATH=/app:/bili-common
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # 关闭容器健康检查：原 30s 一次的 /health 探活会持续刷 uvicorn 访问日志，
      # 且无任何服务以 service_healthy 依赖它。探活能力由 /health 路由本身保留
      # （be-bilibili-crawler 启动期仍会探测一次），只是不再由 Docker 定时调用。
      disable: true
  llama_cpp:
    image: ghcr.nju.edu.cn/ggml-org/llama.cpp:server
    container_name: llama_cpp
    volumes:
      - ./docker_vol/llama/models.ini:/models.ini
      - ./docker_vol/llama_model/cache:/root/.cache
    ports:
      - ${LLAMA_PORT}:8080
    restart: unless-stopped
    environment:
      - LLAMA_ARG_MODELS_PRESET=/models.ini
      - LLAMA_ARG_MODELS_MAX=1
      - HF_ENDPOINT=https://hf-mirror.com
    extra_hosts:
      - "host.docker.internal:host-gateway"
  llama_cpp_gpu_cuda:
    image: ghcr.nju.edu.cn/ggml-org/llama.cpp:server-cuda13
    container_name: llama_cpp_gpu_cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./docker_vol/llama_gpu_model/cache:/root/.cache
    environment:
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=12000
      - LLAMA_ARG_MODEL=HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive:Q4_K_M
      - LLAMA_ARG_MODEL_URL=https://hf-mirror.com/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive/resolve/main/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf?download=true
    ports:
      - "12000:12000"
  nginx:
    container_name: fastapi-nginx
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./docker_vol/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker_vol/nginx/cert:/etc/nginx/cert:ro
      - ./docker_vol/nginx/html:/usr/share/nginx/html
      - ./docker_vol/nginx/logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  be-gateway_node_modules:
networks:
  default:
    enable_ipv6: true
    name: fastapi
    driver: bridge
