worker_processes auto;
events {
    worker_connections  1024;
    accept_mutex on;
  }
http {
  include mime.types;
  default_type application/octet-stream;
  server {
    server_name localhost;
    listen [::]:443 ssl;
    ssl_certificate ./cert/cert.pem;
    ssl_certificate_key ./cert/key.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    location / {
      root html/dist;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
    location ~* "/api/" {
      proxy_pass http://127.0.0.1:9923;
      proxy_set_header Host $host;
      proxy_set_header x-bili-ip $remote_addr;
      proxy_set_header x-bili-forward $proxy_add_x_forwarded_for;
      proxy_set_header x-bili-protocol $scheme;
    }
  }
  server {
    server_name localhost;
    listen [::]:80; # 支持IPv6
    return 301 https://$host$request_uri;
  }
  
  server {
    server_name localhost;
    listen [::]:81;
    ssl_certificate ./cert/cert.pem;
    ssl_certificate_key ./cert/key.pem;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    location / {
      root html/dist;
      index index.html;
      try_files $uri $uri/ /index.html;
    }
    location ~* "/api/" {
      proxy_pass http://127.0.0.1:9923;
      proxy_set_header Host $host;
      proxy_set_header x-bili-ip $remote_addr;
      proxy_set_header x-bili-forward $proxy_add_x_forwarded_for;
      proxy_set_header x-bili-protocol $scheme;
    }
  }
}
