worker_processes auto;
events {
    worker_connections 1024;
    accept_mutex on;
}
http {
    include mime.types;
    default_type application/octet-stream;

    # 开发态压缩：Nuxt/Vite dev server 默认不压缩（为 HMR 性能考虑），
    # 实测首页明文传输 56MB（JS 32MB + Tailwind CSS 1.7MB）。
    # 在 Nginx 层对文本类资源开 gzip，整体可压到 1/4 ~ 1/5。
    # 注意：WebSocket 升级请求不受影响（gzip 只作用于 HTTP 响应体）。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    server {
        listen 80;
        listen [::]:80;

        listen 443;
        listen [::]:443;
        server_name serena.dynv6.net;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-bili-ip $remote_addr;
        proxy_set_header x-bili-forward $proxy_add_x_forwarded_for;
        proxy_set_header x-bili-protocol $scheme;

        # Casdoor 代理
        location ~* "^/casdoor/(.*)" {
            proxy_pass http://host.docker.internal:10011/$1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 后端 API（仅匹配路径开头的 /api/，避免误伤 Vite 源码 /src/api/）
        location ~* "^/api/" {
            # proxy_pass http://host.docker.internal:10007; # 容器网关地址
            proxy_pass http://host.docker.internal:9923;
            # 开发网关地址
        }

        # 前端（Vue dev server，端口 5173）
        location / {
            proxy_pass http://host.docker.internal:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Vite HMR WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    server {
        listen 81;
        listen [::]:81;
        server_name serena.dynv6.net;
        location ^~ / {
            proxy_pass http://host.docker.internal:10011;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_http_version 1.1;
            add_header X-Cache $upstream_cache_status;
            proxy_ssl_server_name off;
            proxy_ssl_name $proxy_host;
        }
    }
}
