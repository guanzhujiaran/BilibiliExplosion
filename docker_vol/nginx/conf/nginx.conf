worker_processes auto;
events {
    worker_connections  1024;
    accept_mutex on;
}
http {
  include mime.types;
  default_type application/octet-stream;
  server {
    listen 80;
    listen [::]:80;

    listen 443;
    listen [::]:443;
    server_name serena.dynv6.net;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-bili-ip $remote_addr;
    proxy_set_header x-bili-forward $proxy_add_x_forwarded_for;
    proxy_set_header x-bili-protocol $scheme;

    # Casdoor 代理
    location ~* "^/casdoor/(.*)" {
      proxy_pass http://host.docker.internal:10011/$1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* "/api/" {
      # proxy_pass http://host.docker.internal:10007; # 容器网关地址
      proxy_pass http://host.docker.internal:9923;
      # 开发网关地址
      proxy_set_header Host $host;
    }

  }
}
